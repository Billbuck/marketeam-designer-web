<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperçu RCS — maquette</title>
<style>
  :root { --bg:#f0f2f5; --txt:#1f2328; --muted:#6b7280; --line:#e5e7eb; --white:#fff; --agent:#4a5568; }
  :root:not([data-theme="light"]) { }
  body { margin:0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background:var(--bg); color:var(--txt); }
  .barre { display:flex; align-items:center; justify-content:center; gap:16px; padding:16px; flex-wrap:wrap; }
  .seg { display:inline-flex; border:1px solid #cbd0d6; border-radius:10px; overflow:hidden; background:var(--white); }
  .seg button { border:0; background:transparent; padding:8px 18px; font-size:14px; cursor:pointer; color:var(--txt); }
  .seg button.on { background:#1f2328; color:#fff; }
  .opt { font-size:14px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .scene { display:flex; justify-content:center; padding: 0 16px 32px; }
  .phone { width:360px; height:740px; border-radius:44px; background:#111; padding:12px; box-shadow:0 12px 40px rgba(0,0,0,.25); position:relative; }
  .ecran { position:relative; width:100%; height:100%; border-radius:34px; overflow:hidden; background:var(--white); display:flex; flex-direction:column; }
  .statut { height:44px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; font-size:14px; font-weight:600; }
  .entete { display:flex; align-items:center; gap:10px; padding:6px 14px 10px; border-bottom:1px solid var(--line); }
  .logo { width:34px; height:34px; border-radius:50%; background:var(--agent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex:none; }
  .nomagent { font-size:15px; font-weight:600; display:flex; align-items:center; gap:6px; }
  .verif { width:14px; height:14px; border-radius:50%; background:#1a73e8; color:#fff; font-size:10px; display:inline-flex; align-items:center; justify-content:center; }
  .conv { flex:1; overflow-y:auto; padding:14px 12px 20px; }
  .heure { text-align:center; font-size:11px; color:var(--muted); margin:0 0 10px; }
  .carte { background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; width:100%; }
  .media { height:140px; background:#c9d3df; display:flex; align-items:center; justify-content:center; color:#4a5568; font-size:13px; }
  .corps { padding:12px 14px 6px; }
  .titre { font-size:15px; font-weight:600; margin:0 0 4px; }
  .texte { font-size:13.5px; color:#374151; line-height:1.4; margin:0 0 6px; }
  .btns { border-top:1px solid var(--line); }
  .btn { display:flex; align-items:center; gap:8px; padding:11px 14px; font-size:14px; color:#1a73e8; border-top:1px solid var(--line); cursor:pointer; user-select:none; }
  .btn:first-child { border-top:0; }
  .btn:active { background:#f3f4f6; }
  .btn .ic { width:18px; text-align:center; font-size:15px; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:10px 2px 4px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; border:1px solid #cbd0d6; border-radius:20px; padding:8px 14px; font-size:13.5px; color:#1a73e8; background:#fff; cursor:pointer; white-space:nowrap; }
  .chip:active { background:#eef2f7; }
  /* Android : carrousel horizontal */
  .carrousel-android { display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; padding:2px 0 6px; scrollbar-width:none; }
  .carrousel-android::-webkit-scrollbar { display:none; }
  .carrousel-android .carte { flex:none; width:250px; scroll-snap-align:start; user-select:none; }
  .carrousel-android { cursor:grab; }
  .carrousel-android:active { cursor:grabbing; }
  /* iPhone : pile de cartes */
  .pile { position:relative; height:456px; padding-top:48px; }
  .pile .carte { position:absolute; left:0; right:0; top:48px; height:400px; display:flex; flex-direction:column; transition:transform .35s ease, opacity .35s ease; background:#fff; pointer-events:none; }
  .pile .carte.devant { pointer-events:auto; cursor:grab; user-select:none; }
  .pile .carte.devant:active { cursor:grabbing; }
  .pile .carte.devant .ios-options { cursor:pointer; }
  .pile .carte .corps { flex:1; overflow:hidden; }
  .ios-options { display:flex; align-items:center; justify-content:center; gap:6px; padding:11px; font-size:15px; color:#0a84ff; border-top:1px solid var(--line); cursor:pointer; user-select:none; }
  .pile-nav { display:flex; justify-content:center; gap:6px; margin-top:8px; }
  .pile-nav span { width:7px; height:7px; border-radius:50%; background:#cbd0d6; }
  .pile-nav span.on { background:#0a84ff; }
  .aide { text-align:center; font-size:11px; color:var(--muted); margin-top:6px; }
  /* Volets et pages simulées */
  .voile { position:absolute; inset:0; background:rgba(0,0,0,.35); display:none; align-items:flex-end; z-index:5; }
  .voile.on { display:flex; }
  .volet { width:100%; background:#fff; border-radius:20px 20px 0 0; overflow:hidden; display:flex; flex-direction:column; animation:monte .25s ease; }
  @keyframes monte { from { transform:translateY(40px); opacity:.6; } to { transform:none; opacity:1; } }
  .volet.h50 { height:50%; } .volet.h75 { height:75%; } .volet.h100 { height:100%; border-radius:0; }
  .poignee { width:40px; height:5px; border-radius:3px; background:#cbd0d6; margin:8px auto 4px; flex:none; }
  .adresse { display:flex; align-items:center; gap:8px; padding:8px 12px; background:#f3f4f6; font-size:12px; color:#374151; flex:none; }
  .adresse span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fermer { border:0; background:transparent; font-size:18px; cursor:pointer; color:#374151; }
  .pagebouton { flex:1; display:flex; flex-direction:column; }
  .pb-entete { background:var(--agent); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px; font-weight:600; }
  .pb-corps { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:20px; gap:12px; }
  .pb-coche { width:56px; height:56px; border-radius:50%; background:var(--agent); color:#fff; font-size:28px; display:flex; align-items:center; justify-content:center; }
  .pb-btn { display:block; width:100%; background:var(--agent); color:#fff; text-decoration:none; padding:13px; border-radius:10px; font-weight:600; font-size:15px; }
  .pb-note { font-size:12px; color:var(--muted); word-break:break-all; }
  .listeopt { padding:6px 0 14px; }
  .listeopt .btn { color:#0a84ff; font-size:16px; padding:13px 20px; }
  .toast { position:absolute; left:20px; right:20px; bottom:70px; background:#1f2328; color:#fff; padding:12px 14px; border-radius:12px; font-size:13px; line-height:1.4; display:none; z-index:6; }
  .toast.on { display:block; }
  .repli { max-width:360px; margin:0 auto 32px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:13px; color:#374151; display:none; }
  .repli.on { display:block; }
  .repli b { display:block; margin-bottom:4px; color:var(--txt); }
  .webpage { flex:1; padding:16px; font-size:13px; color:#374151; }
</style>
</head>
<body>

<div class="barre">
  <div class="seg" role="group" aria-label="Type d'appareil">
    <button id="bAndroid" class="on" onclick="setMode('android')">Android</button>
    <button id="bIphone" onclick="setMode('iphone')">iPhone</button>
  </div>
  <label class="opt"><input type="checkbox" id="ckRepli" onchange="document.getElementById('repli').classList.toggle('on', this.checked)"> Afficher le repli SMS</label>
</div>

<div class="scene">
  <div class="phone">
    <div class="ecran">
      <div class="statut"><span id="heure">10:56</span><span>5G ▮▮▮</span></div>
      <div class="entete">
        <div class="logo">C</div>
        <div class="nomagent">Chronodirect <span class="verif">✓</span></div>
      </div>
      <div class="conv" id="conv"></div>
      <div class="voile" id="voile" onclick="if(event.target===this) fermeVolet()"><div class="volet" id="volet"></div></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<div class="repli" id="repli">
  <b>Téléphone non compatible RCS → SMS de repli</b>
  Les rendez-vous du samedi ACTENA ! Nouveautés et offres exclusives le 19/09 de 9h à 18h. +d'infos : cliquez.info/@test STOP 36XXX
</div>

<script>
const message = {
  agent: { nom: "Chronodirect", couleur: "#4a5568" },
  type: "CAROUSEL",
  cartes: [
    { titre: "Les rendez-vous du samedi", texte: "Nouveautés et offres exclusives vous attendent le 19/09 de 9h à 18h dans votre concession.", media: "Image 1440 × 720",
      boutons: [
        { libelle: "En savoir plus", type: "LIEN", url: "https://www.google.fr", ic: "↗" },
        { libelle: "Ça m'intéresse", type: "REACTION", confirmation: "C'est noté, vous serez recontacté.", ic: "✓" },
        { libelle: "Nous appeler", type: "APPEL", tel: "06 70 29 95 92", ic: "☎" } ] },
    { titre: "Nouveautés EX40, EC40, XC40", texte: "Découvrez toute la gamme et réservez votre essai.", media: "Image 1440 × 720",
      boutons: [
        { libelle: "Ajouter à l'agenda", type: "AGENDA", agenda: "Ventes privées — 01/10 de 09:00 à 16:00", ic: "▦" },
        { libelle: "Itinéraire", type: "ITINERAIRE", adresse: "12 avenue de Paris, 92200 Neuilly", ic: "➤" },
        { libelle: "Notre appli", type: "APPLICATION", ic: "▣" } ] },
    { titre: "Reprise de votre véhicule", texte: "Estimation gratuite en concession, offre de reprise majorée pendant l'événement.", media: "Image 1440 × 720",
      boutons: [
        { libelle: "Estimer mon véhicule", type: "LIEN", url: "https://www.google.fr", ic: "↗" } ] },
    { titre: "Financement et LLD", texte: "Des offres de financement adaptées, réponse sous 48 h.", media: "Image 1440 × 720",
      boutons: [
        { libelle: "Demander une offre", type: "REACTION", confirmation: "Merci, un conseiller vous rappelle sous 48 h.", ic: "✓" },
        { libelle: "Nous écrire", type: "EMAIL", email: "contact@chronodirect.com", ic: "✉" } ] }
  ],
  boutonsCommuns: [
    { libelle: "Découvrir l'offre", type: "LANDING", url: "https://cliquez.info/@test" },
    { libelle: "Nous écrire", type: "EMAIL", email: "contact@chronodirect.com" },
    { libelle: "Par SMS", type: "SMS", tel: "06 70 29 95 92" },
    { libelle: "WhatsApp", type: "WHATSAPP", url: "https://wa.me/33670299592" }
  ]
};

let mode = "android";
let pileIndex = 0;

function setMode(m) {
  mode = m;
  document.getElementById("bAndroid").classList.toggle("on", m === "android");
  document.getElementById("bIphone").classList.toggle("on", m === "iphone");
  fermeVolet();
  rendu();
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function carteHtml(c, i) {
  let h = `<div class="carte" data-i="${i}"><div class="media">${esc(c.media)}</div><div class="corps"><p class="titre">${esc(c.titre)}</p><p class="texte">${esc(c.texte)}</p></div>`;
  if (mode === "android") {
    h += `<div class="btns">` + c.boutons.map((b, j) => `<div class="btn" onclick="action(${i},${j})"><span class="ic">${b.ic}</span>${esc(b.libelle)}</div>`).join("") + `</div>`;
  } else if (c.boutons.length === 1) {
    h += `<div class="ios-options" onclick="action(${i},0)">${esc(c.boutons[0].libelle)}</div>`;
  } else if (c.boutons.length > 1) {
    h += `<div class="ios-options" onclick="ouvreOptions(${i})">Options <span style="font-size:12px">▾</span></div>`;
  }
  return h + `</div>`;
}

function rendu() {
  const conv = document.getElementById("conv");
  let h = `<p class="heure">Aujourd'hui 10:56</p>`;
  if (mode === "android") {
    h += `<div class="carrousel-android">` + message.cartes.map(carteHtml).join("") + `</div>`;
  } else {
    h += `<div class="pile" id="pile">` + message.cartes.map(carteHtml).join("") + `</div>`;
    h += `<div class="pile-nav" id="pileNav">` + message.cartes.map((c, i) => `<span class="${i === pileIndex ? "on" : ""}"></span>`).join("") + `</div>`;
    h += `<p class="aide">Glissez la carte pour voir la suivante</p>`;
  }
  h += `<div class="chips">` + message.boutonsCommuns.map((b, j) => `<span class="chip" onclick="action(-1,${j})">${esc(b.libelle)}</span>`).join("") + `</div>`;
  conv.innerHTML = h;
  if (mode === "iphone") { placePile(); initSwipe(); } else { initGlisseAndroid(); }
}

function initGlisseAndroid() {
  const bande = document.querySelector(".carrousel-android");
  if (!bande) return;
  let x0 = null, scroll0 = 0, bouge = false;
  bande.addEventListener("pointerdown", e => { x0 = e.clientX; scroll0 = bande.scrollLeft; bouge = false; bande.style.scrollSnapType = "none"; });
  bande.addEventListener("pointermove", e => {
    if (x0 === null) return;
    const dx = e.clientX - x0;
    if (Math.abs(dx) > 6) bouge = true;
    bande.scrollLeft = scroll0 - dx;
  });
  const fin = () => {
    if (x0 === null) return;
    x0 = null;
    const largeur = 260;
    const cible = Math.round(bande.scrollLeft / largeur) * largeur;
    bande.scrollTo({ left: cible, behavior: "smooth" });
    setTimeout(() => { bande.style.scrollSnapType = "x mandatory"; }, 350);
  };
  bande.addEventListener("pointerup", fin);
  bande.addEventListener("pointerleave", fin);
  bande.addEventListener("click", e => { if (bouge) { e.stopPropagation(); e.preventDefault(); } }, true);
}

function placePile() {
  const cartes = document.querySelectorAll("#pile .carte");
  const n = cartes.length;
  cartes.forEach(c => {
    const i = +c.dataset.i;
    const rang = (i - pileIndex + n) % n;
    c.style.zIndex = n - rang;
    c.style.transform = `translateY(${-rang * 16}px) scale(${1 - rang * 0.05})`;
    c.style.opacity = rang > 3 ? 0 : 1;
    c.classList.toggle("devant", rang === 0);
  });
  document.querySelectorAll("#pileNav span").forEach((s, i) => s.classList.toggle("on", i === pileIndex));
}

function initSwipe() {
  const pile = document.getElementById("pile");
  let x0 = null;
  pile.addEventListener("pointerdown", e => { x0 = e.clientX; });
  pile.addEventListener("pointerup", e => {
    if (x0 === null) return;
    const dx = e.clientX - x0; x0 = null;
    if (Math.abs(dx) < 40) return;
    const top = pile.querySelector(`.carte[data-i="${pileIndex}"]`);
    top.style.transform = `translateX(${dx < 0 ? -420 : 420}px) rotate(${dx < 0 ? -8 : 8}deg)`;
    setTimeout(() => { pileIndex = (pileIndex + 1) % message.cartes.length; placePile(); }, 300);
  });
}

function ouvreOptions(i) {
  const c = message.cartes[i];
  const html = `<div class="poignee"></div><div class="listeopt">` +
    c.boutons.map((b, j) => `<div class="btn" onclick="action(${i},${j})"><span class="ic">${b.ic}</span>${esc(b.libelle)}</div>`).join("") +
    `<div class="btn" style="color:#6b7280" onclick="fermeVolet()">Annuler</div></div>`;
  ouvreVolet(html, "h50");
}

function ouvreVolet(html, taille) {
  const v = document.getElementById("volet");
  v.className = "volet " + taille;
  v.innerHTML = html;
  document.getElementById("voile").classList.add("on");
}
function fermeVolet() { document.getElementById("voile").classList.remove("on"); }

function toast(txt) {
  const t = document.getElementById("toast");
  t.textContent = txt; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 3200);
}

function pageBouton(contenu, url, taille) {
  return `<div class="poignee"></div><div class="adresse"><span>${esc(url)}</span><button class="fermer" onclick="fermeVolet()" aria-label="Fermer">✕</button></div>
    <div class="pagebouton"><div class="pb-entete"><div class="logo" style="width:28px;height:28px;font-size:13px">C</div>Chronodirect</div><div class="pb-corps">${contenu}</div></div>`;
}

function action(i, j) {
  const b = i < 0 ? message.boutonsCommuns[j] : message.cartes[i].boutons[j];
  fermeVolet();
  const surTel = mode === "iphone" ? "l'iPhone" : "l'Android";
  switch (b.type) {
    case "LIEN":
      ouvreVolet(`<div class="poignee"></div><div class="adresse"><span>${esc(b.url)}</span><button class="fermer" onclick="fermeVolet()" aria-label="Fermer">✕</button></div>
        <div class="webpage"><p>Le navigateur du téléphone ouvre cette adresse.</p><p><a href="${esc(b.url)}" target="_blank" rel="noopener">Ouvrir réellement dans un nouvel onglet ↗</a></p></div>`, "h100");
      break;
    case "LANDING":
      ouvreVolet(`<div class="poignee"></div><div class="adresse"><span>${esc(b.url)}</span><button class="fermer" onclick="fermeVolet()" aria-label="Fermer">✕</button></div>
        <div class="webpage"><p>Landing page de test du destinataire (code @test).</p><p><a href="${esc(b.url)}" target="_blank" rel="noopener">Ouvrir la landing page ↗</a></p></div>`, "h100");
      break;
    case "REACTION":
      ouvreVolet(pageBouton(`<div class="pb-coche">✓</div><p style="font-size:15px;margin:0">${esc(b.confirmation)}</p>`, "https://cliquez.info/Bouton.awp?P1=…&P2=@test", "h50"), "h50");
      break;
    case "APPLICATION":
      ouvreVolet(pageBouton(`<p style="margin:0">Téléchargez l'application :</p><a class="pb-btn" href="#" onclick="event.preventDefault();toast('Sur ${surTel} : ouverture du store correspondant')">${mode === "iphone" ? "App Store (iPhone)" : "Google Play (Android)"}</a>`, "https://cliquez.info/Bouton.awp?P1=…&P2=@test", "h75"), "h75");
      break;
    case "EMAIL":
      ouvreVolet(pageBouton(`<p style="margin:0">Votre messagerie va s'ouvrir automatiquement.<br>Si rien ne se passe, appuyez sur le bouton :</p><a class="pb-btn" href="#" onclick="event.preventDefault();toast('Sur ${surTel} : ouverture de la messagerie, destinataire ${esc(b.email)}')">Ouvrir ma messagerie</a><p class="pb-note">Destinataire : ${esc(b.email)}</p>`, "https://cliquez.info/Bouton.awp?P1=…&P2=@test", "h75"), "h75");
      break;
    case "SMS":
      ouvreVolet(pageBouton(`<p style="margin:0">Votre application SMS va s'ouvrir automatiquement.<br>Si rien ne se passe, appuyez sur le bouton :</p><a class="pb-btn" href="#" onclick="event.preventDefault();toast('Sur ${surTel} : ouverture de l\\'application SMS, numéro ${esc(b.tel)}')">Envoyer le SMS</a><p class="pb-note">Numéro : ${esc(b.tel)}</p>`, "https://cliquez.info/Bouton.awp?P1=…&P2=@test", "h75"), "h75");
      break;
    case "APPEL": toast(`Sur ${surTel} : le composeur s'ouvre avec le ${b.tel}.`); break;
    case "AGENDA": toast(`Sur ${surTel} : l'agenda s'ouvre avec l'événement « ${b.agenda} ».`); break;
    case "ITINERAIRE": toast(`Sur ${surTel} : Plans / Google Maps s'ouvre avec l'itinéraire vers ${b.adresse}.`); break;
    case "WHATSAPP": toast(`Sur ${surTel} : WhatsApp s'ouvre sur la conversation (${b.url}).`); break;
  }
}

rendu();
</script>
</body>
</html>
